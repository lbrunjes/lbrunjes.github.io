<!doctype html>
<html lang="en">
  <head>
    <script>
      function showCookieBanner() {
        if (document.getElementById("cookie-banner")) return;

        const btn =
          "padding:8px 16px;border-radius:6px;font:inherit;cursor:pointer;border:1px solid #1f6fd1;";
        const banner = document.createElement("div");
        banner.id = "cookie-banner";
        banner.setAttribute("role", "dialog");
        banner.setAttribute("aria-label", "Cookie consent");
        banner.style.cssText =
          "position:fixed;left:1ex;right:1ex;bottom:1ex;z-index:2147483646;" +
          "width:30em;margin:0 auto;padding:2ex ;border:1px solid; opacity:1;transition:opacity .2s ease;";
        banner.innerHTML = `
      <button aria-label="Close" style="position:absolute;top:6px;right:10px;border:0;background:none;line-height:1;cursor:pointer;color:#666">&times;</button>
      <p>
        We use cookies only for login and other techincal measures.
        <br/> By continuing to use this site
        you agree to share your cookies.
      </p>
      <div style="text-align:right;">
        <button >Share</button>

      </div>`;

        banner.addEventListener("click", (e) => {
          if (!e.target.closest("button")) return;
          banner.remove();
          showCookieMonster();
        });

        document.body.appendChild(banner);
      }

      function showCookieMonster() {
        const imageSrc =
          "data:image/svg+xml;charset=utf-8," +
          encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
          <circle cx="100" cy="112" r="82" fill="#1f6fd1" stroke="#1f6fd1"
                  stroke-width="12" stroke-dasharray="3 4"/>
          <circle cx="68" cy="45" r="28" fill="#fff" stroke="#000" stroke-width="3"/>
          <circle cx="132" cy="45" r="28" fill="#fff" stroke="#000" stroke-width="3"/>
          <circle cx="78" cy="55" r="11" fill="#000"/>
          <circle cx="122" cy="55" r="11" fill="#000"/>
          <path d="M40 115 Q100 205 160 115 Z" fill="#111"/>
          <circle cx="118" cy="140" r="22" fill="#c8893c"/>
          <circle cx="110" cy="132" r="3.5" fill="#4a2a10"/>
          <circle cx="126" cy="136" r="3.5" fill="#4a2a10"/>
          <circle cx="114" cy="150" r="3.5" fill="#4a2a10"/>
          <circle cx="128" cy="150" r="2.5" fill="#4a2a10"/>
        </svg>`);

        const overlay = document.createElement("div");
        overlay.style.cssText =
          "position:fixed;left:1ex;right:1ex;bottom:1ex;z-index:2147483647;display:flex;flex-direction:column;" +
          "align-items:center;justify-content:center;opacity:1;transition:opacity .2s ease;";

        const img = document.createElement("img");
        img.src = imageSrc;
        img.alt = "Cookie Monster: fool!";
        img.style.cssText = "height:auto;";

        const text = document.createElement("h2");
        text.textContent = "FOOL!";
        text.append(img);
        overlay.append(text);

        document.body.appendChild(overlay);

        setTimeout(() => {
          overlay.style.opacity = "0";
          overlay.style.pointerEvents = "none";
          const cleanup = () => overlay.remove();
          overlay.addEventListener("transitionend", cleanup, { once: true });
          setTimeout(cleanup, 1000); // in case transitionend never fires
        }, 2000);
      }
    </script>
    <title>Cookie demo</title>
  </head>
  <body>
    <article>
      <header>
        <h1>A totally sane web page</h1>
        <p>Something tells me its just a test</p>
      </header>
      <p>Some text goes in here</p>
    </article>
    <script>
      showCookieBanner();
    </script>
  </body>
</html>
